name = "poolLog"
compatibility_date = "2024-09-01"
pages_build_output_dir = "."

# Create the namespace with:
#   wrangler kv namespace create POOL_KV
# then replace the id below with the one it prints. This binding is also
# needed in the Cloudflare dashboard (Pages project -> Settings -> Functions
# -> KV namespace bindings) for the deployed site, not just local dev.
[[kv_namespaces]]
binding = "POOL_KV"
id = "pool-log"
